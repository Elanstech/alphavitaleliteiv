<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Staff Forms | Alpha Vital Elite IV</title>
<link rel="icon" href="/assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F6F1E7;
    --forest: #203421;
    --forest-deep: #101B13;
    --forest-mid: #2C4530;
    --gold: #C1963F;
    --gold-lite: #E7CB86;
    --ink: #1E2A20;
    --ink-soft: #465043;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Instrument Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--forest-deep);
    color: var(--cream);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { height: 44px; width: auto; background: var(--cream); border-radius: 8px; padding: 4px 8px; }
  .brand h1 { font-family: 'Prata', serif; font-weight: 400; font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
  .brand span { display: block; font-size: .8rem; color: var(--gold-lite); letter-spacing: .08em; text-transform: uppercase; }
  .records {
    color: var(--forest-deep);
    background: var(--gold);
    text-decoration: none;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 1rem;
  }
  .records:hover { background: var(--gold-lite); }
  nav {
    display: flex;
    gap: 12px;
    padding: 16px 20px 0;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1 1 220px;
    border: 2px solid var(--forest-mid);
    background: #fff;
    color: var(--forest);
    font: inherit;
    font-weight: 600;
    font-size: 1.1rem;
    padding: 18px 16px;
    border-radius: 14px;
    cursor: pointer;
    text-align: left;
  }
  .tab small { display: block; font-weight: 400; font-size: .85rem; color: var(--ink-soft); margin-top: 4px; }
  .tab[aria-selected="true"] { background: var(--forest); color: var(--cream); border-color: var(--forest); }
  .tab[aria-selected="true"] small { color: var(--gold-lite); }
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .bar p { margin: 0; color: var(--ink-soft); font-size: .95rem; }
  .restart {
    font: inherit;
    font-weight: 600;
    background: transparent;
    border: 2px solid var(--gold);
    color: var(--forest);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
  }
  main { flex: 1; padding: 0 20px 20px; display: flex; }
  iframe {
    flex: 1;
    width: 100%;
    min-height: 75vh;
    border: 0;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 2px 14px rgba(16, 27, 19, .12);
  }
  @media (max-width: 600px) {
    header, nav, .bar { padding-left: 16px; padding-right: 16px; }
    main { padding: 0 16px 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/assets/images/logo.png" alt="Alpha Vital Elite IV">
    <div>
      <h1>Staff Forms</h1>
      <span>Alpha Vital Elite IV</span>
    </div>
  </div>
  <a class="records" href="https://hipaa.jotform.com/inbox/" target="_blank" rel="noopener">View Records ↗</a>
</header>

<nav role="tablist" aria-label="Forms">
  <button class="tab" role="tab" aria-selected="true" data-form="262495775441063">
    Patient Record &amp; Consent
    <small>Every visit: infusion, injection or hydrogen</small>
  </button>
  <button class="tab" role="tab" aria-selected="false" data-form="262387848695075">
    Patient Medical History
    <small>New patients, completed in the clinic</small>
  </button>
</nav>

<div class="bar">
  <p id="hint">Pick the visit type, enter the patient's name, then hand the tablet over to sign.</p>
  <button class="restart" type="button" id="restart">Start new form</button>
</div>

<main>
  <iframe id="form" title="Patient Record &amp; Consent"
    src="https://hipaa.jotform.com/262495775441063"
    allow="geolocation; microphone; camera; fullscreen"></iframe>
</main>

<script>
  const frame = document.getElementById('form');
  const hint = document.getElementById('hint');
  const hints = {
    '262495775441063': "Pick the visit type, enter the patient's name, then hand the tablet over to sign.",
    '262387848695075': 'Have the patient fill this out on the tablet, then submit.'
  };
  let current = '262495775441063';

  function load(id) {
    current = id;
    frame.src = 'https://hipaa.jotform.com/' + id + '?t=' + Date.now();
    hint.textContent = hints[id];
  }

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', 'false'));
      tab.setAttribute('aria-selected', 'true');
      frame.title = tab.firstChild.textContent.trim();
      load(tab.dataset.form);
    });
  });

  document.getElementById('restart').addEventListener('click', () => {
    if (confirm('Clear this form and start a new one? Anything not submitted will be lost.')) load(current);
  });
</script>
</body>
</html>
